<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="preload" href="assets/abertura_pergaminho.mp4" as="video" type="video/mp4">
<link rel="preload" href="assets/musica_convite.mp3" as="audio" type="audio/mpeg">
<title>Convocação Real</title>

<style>
  :root {
    --ink-rose: #8c2f4a;
    --ink-brown: #5a3a1e;
    --cream: #fbf1e2;
    --skip-bg: rgba(255, 210, 225, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2a0f14;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .app {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #bg-img {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    filter: blur(11px) brightness(0.82) saturate(1.08);
    transform: scale(1.08);
  }

  .stage-column {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 0.8vh;
  }

  .scroll-stage {
    position: relative;
    width: min(98vw, 90vh * 0.5628);
    aspect-ratio: 941 / 1672;
    flex-shrink: 0;
    cursor: pointer;
    container-type: inline-size;
    container-name: scroll;
  }

  .scroll-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  #scroll-closed {
    z-index: 3;
    transform-origin: top center;
    animation: pendulum 4.5s ease-in-out infinite;
    transition: opacity 0.6s ease;
  }

  #scroll-closed.swing-stopped {
    animation-play-state: paused;
  }

  #scroll-closed.faded {
    opacity: 0;
  }

  .scroll-stage:hover #scroll-closed:not(.faded) {
    filter: brightness(1.06);
  }

  #scroll-open {
    z-index: 2;
    opacity: 1;
    clip-path: inset(50% 0% 50% 0%);
    transform-origin: center;
    transition: clip-path 1.5s cubic-bezier(.65, 0, .35, 1) 0.35s;
  }

  #scroll-open.revealed {
    clip-path: inset(0% 0% 0% 0%);
  }

  /* Once the opening video hands off to the final artwork, both the
     open scroll and its text snap into place instantly (no transition)
     while still hidden behind the video — only the video's own opacity
     animates, so the swap reads as one continuous motion. */
  #scroll-open.instant {
    transition: none;
  }

  #video-abertura {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    background: transparent;
    transition: opacity 0.4s ease;
  }

  #video-abertura.active {
    opacity: 1;
  }

  .roll-shadow {
    position: absolute;
    left: 0;
    right: 0;
    height: 7%;
    z-index: 4;
    background: linear-gradient(to bottom, rgba(40, 18, 8, 0) 0%, rgba(40, 18, 8, 0.4) 50%, rgba(40, 18, 8, 0) 100%);
    opacity: 0;
    pointer-events: none;
  }

  .roll-shadow-top {
    top: 50%;
    transform: translateY(-100%);
  }

  .roll-shadow-bottom {
    top: 50%;
  }

  .roll-shadow-top.sweeping {
    animation: sweepTop 1.5s cubic-bezier(.65, 0, .35, 1) 0.35s forwards;
  }

  .roll-shadow-bottom.sweeping {
    animation: sweepBottom 1.5s cubic-bezier(.65, 0, .35, 1) 0.35s forwards;
  }

  @keyframes sweepTop {
    0%   { top: 50%; opacity: 0; }
    10%  { opacity: 0.9; }
    100% { top: 0%; opacity: 0; }
  }

  @keyframes sweepBottom {
    0%   { top: 50%; opacity: 0; }
    10%  { opacity: 0.9; }
    100% { top: 100%; opacity: 0; }
  }

  @keyframes pendulum {
    0%   { transform: rotate(-1.5deg); }
    50%  { transform: rotate(1.5deg); }
    100% { transform: rotate(-1.5deg); }
  }

  .cta-text {
    margin-top: 1.6vh;
    width: 82vw;
    max-width: 420px;
    color: #fff8ee;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.04em;
    text-align: center;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 0, 0, 0.35);
    animation: pulse 2.1s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }

  .cta-text.hidden {
    opacity: 0 !important;
    animation: none;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.65; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.03); }
  }

  .skip-btn {
    position: fixed;
    right: 4vw;
    bottom: 3.2vh;
    z-index: 10;
    padding: 0.55em 1.2em;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: var(--skip-bg);
    backdrop-filter: blur(3px);
    color: #fff;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(12px, 3.2vw, 15px);
    letter-spacing: 0.03em;
    cursor: pointer;
    opacity: 0;
    animation: skipFadeIn 0.6s ease forwards;
    animation-delay: 2.4s;
    transition: opacity 0.4s ease, transform 0.15s ease;
  }

  .skip-btn:hover {
    background: rgba(255, 210, 225, 0.5);
    transform: scale(1.03);
  }

  .skip-btn:active {
    transform: scale(0.96);
  }

  .skip-btn.hidden {
    opacity: 0 !important;
    pointer-events: none;
  }

  @keyframes skipFadeIn {
    to { opacity: 1; }
  }

  .music-toggle {
    position: fixed;
    top: 3vh;
    right: 4vw;
    z-index: 10;
    width: 2.6em;
    height: 2.6em;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: var(--skip-bg);
    backdrop-filter: blur(3px);
    color: #fff;
    font-size: clamp(14px, 3.4vw, 18px);
    cursor: pointer;
    opacity: 0;
    animation: skipFadeIn 0.6s ease forwards;
    animation-delay: 2.4s;
    transition: opacity 0.4s ease, transform 0.15s ease, background 0.2s ease;
  }

  .music-toggle:hover {
    background: rgba(255, 210, 225, 0.5);
    transform: scale(1.06);
  }

  .music-toggle:active {
    transform: scale(0.94);
  }

  .music-toggle.muted {
    opacity: 0.55;
  }

  /* ---- Invite text overlaid on the open scroll ---- */

  .invite-content {
    position: absolute;
    left: 28%;
    right: 28%;
    top: 33%;
    bottom: 26%;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqw;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    pointer-events: none;
  }

  .invite-content.shown {
    opacity: 1;
    transform: translateY(0);
  }

  .invite-content.instant {
    transition: none;
  }

  .inv-name {
    font-family: 'Great Vibes', cursive;
    color: var(--ink-rose);
    font-size: clamp(21px, 7.3cqw, 31.5px);
    line-height: 1;
  }

  .inv-age {
    margin-top: 0.1em;
    color: var(--ink-brown);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    font-size: clamp(9px, 2.91cqw, 12.5px);
  }

  .inv-eyebrow {
    font-family: 'Great Vibes', cursive;
    color: var(--ink-rose);
    font-size: clamp(16px, 5.3cqw, 23px);
    line-height: 1;
  }

  .inv-message {
    color: var(--ink-brown);
    font-weight: 600;
    font-size: clamp(8.5px, 2.47cqw, 12px);
    line-height: 1.2;
    max-width: 100%;
  }

  .inv-datetime {
    display: flex;
    width: 100%;
    justify-content: space-between;
    padding: 0 1%;
  }

  .inv-datetime .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ink-brown);
  }

  .inv-datetime .big {
    font-weight: 700;
    font-size: clamp(11px, 3.53cqw, 16px);
    letter-spacing: 0.05em;
  }

  .inv-datetime .small {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: clamp(7.5px, 2.21cqw, 10.5px);
    margin-top: 0.05em;
  }

  .inv-venue {
    color: var(--ink-brown);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(7.5px, 2.32cqw, 10.5px);
    line-height: 1.25;
    max-width: 100%;
  }

  .inv-whatsapp {
    color: var(--ink-brown);
    font-weight: 600;
    letter-spacing: 0.01em;
    font-size: clamp(7.5px, 2.21cqw, 10.5px);
    line-height: 1.15;
    max-width: 100%;
  }

  .inv-closing {
    font-family: 'Great Vibes', cursive;
    color: var(--ink-rose);
    font-size: clamp(14px, 4.31cqw, 18px);
    line-height: 1;
  }

  .brand-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0.9vh;
    z-index: 10;
    text-align: center;
    color: rgba(255, 248, 238, 0.75);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(9px, 2.4vw, 11px);
    letter-spacing: 0.08em;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }

  /* Short / landscape viewports (rotated phones, small browser windows):
     shrink the card and tighten the UI below it so nothing overlaps. */
  @media (max-height: 560px) {
    .stage-column {
      padding-top: 0.5vh;
    }
    .scroll-stage {
      width: min(98vw, 76vh * 0.5628);
    }
    .cta-text {
      margin-top: 0.6vh;
      font-size: clamp(11px, 3vw, 14px);
    }
    .skip-btn {
      bottom: 1.1vh;
      padding: 0.4em 1em;
      font-size: clamp(10px, 2.6vw, 13px);
    }
    .music-toggle {
      top: 1.4vh;
      width: 2.2em;
      height: 2.2em;
    }
    .brand-footer {
      bottom: 0.3vh;
      font-size: clamp(7px, 2vw, 9px);
    }
    /* On very short viewports the card itself must shrink a lot to fit;
       let the text scale fully with it instead of holding a legibility
       floor, or it would overflow its band on the tiny card. */
    .inv-name    { font-size: 7.3cqw; }
    .inv-age     { font-size: 2.91cqw; }
    .inv-eyebrow { font-size: 5.3cqw; }
    .inv-message { font-size: 2.47cqw; }
    .inv-datetime .big   { font-size: 3.53cqw; }
    .inv-datetime .small { font-size: 2.21cqw; }
    .inv-venue    { font-size: 2.32cqw; }
    .inv-whatsapp { font-size: 2.21cqw; }
    .inv-closing  { font-size: 4.31cqw; }
  }

  @media (prefers-reduced-motion: reduce) {
    #scroll-closed,
    .roll-shadow,
    .cta-text,
    .skip-btn,
    .music-toggle {
      animation: none !important;
    }
    #video-abertura {
      display: none !important;
    }
    * {
      transition-duration: 0.001ms !important;
    }
  }
</style>

<div class="app">
  <img id="bg-img" src="assets/salao-fundo.png" alt="">

  <div class="stage-column">
    <div class="scroll-stage" id="scroll-stage" role="button" tabindex="0" aria-label="Abrir convite">
      <img id="scroll-closed" src="assets/pergaminho-fechad.png" alt="Pergaminho real fechado">
      <img id="scroll-open" src="assets/pergaminho-aberto.png" alt="Pergaminho real aberto">

      <video
        id="video-abertura"
        preload="auto"
        playsinline
        webkit-playsinline="true"
        disablepictureinpicture
        controlslist="nodownload nofullscreen noremoteplayback"
        aria-hidden="true"
      >
        <source src="assets/abertura_pergaminho.mp4" type="video/mp4">
      </video>

      <div class="roll-shadow roll-shadow-top" id="roll-shadow-top"></div>
      <div class="roll-shadow roll-shadow-bottom" id="roll-shadow-bottom"></div>

      <div class="invite-content" id="invite-content">
        <div>
          <div class="inv-name" id="inv-name"></div>
          <div class="inv-age" id="inv-age"></div>
        </div>

        <div class="inv-eyebrow" id="inv-eyebrow"></div>

        <div class="inv-message" id="inv-message"></div>

        <div class="inv-datetime">
          <div class="col">
            <span class="big" id="inv-day"></span>
            <span class="small" id="inv-month"></span>
          </div>
          <div class="col">
            <span class="big" id="inv-time"></span>
            <span class="small" id="inv-weekday"></span>
          </div>
        </div>

        <div class="inv-venue" id="inv-venue"></div>

        <div class="inv-whatsapp" id="inv-whatsapp"></div>

        <div class="inv-closing" id="inv-closing"></div>
      </div>

      <!-- Shares the .invite-content box (same position/size as the invite
           text above) and the same #scroll-open parchment, already on
           screen — so no second image ever needs to load. -->
      <div class="invite-content" id="gift-content">
        <div class="inv-eyebrow" id="gift-eyebrow"></div>
        <div class="inv-name" id="gift-name"></div>
        <div class="inv-venue" id="gift-categories"></div>
        <div class="inv-closing" id="gift-closing"></div>
      </div>
    </div>

    <div class="cta-text" id="cta-text">Clique para assistir uma convocação real</div>
  </div>

  <button class="skip-btn" id="skip-btn" type="button">Convocação Real</button>

  <button class="music-toggle" id="music-toggle" type="button" aria-label="Ativar ou desativar a música">&#9835;</button>

  <div class="brand-footer">By Luiza</div>

  <audio id="bg-music" preload="auto" loop playsinline>
    <source src="assets/musica_convite.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  // ---- Edit invitation data here ----
  const CONFIG = {
    name: 'Luiza',
    age: '1 ano',
    eyebrow: 'Convocação Real',
    message: 'O reino encantado está em festa. A sua alteza real, a Princesa Luiza convoca todos os príncipes e princesas dos reinos vizinhos para a comemoração do seu 1º ano de reinado!',
    day: '13',
    month: 'Setembro',
    time: 'Às 16:00h',
    weekday: 'Domingo',
    venueName: 'W. A Espaço Lazer',
    venueAddress: 'Rua José Esteves, 266, Bairro Ibraim',
    city: 'Cataguases, MG',
    whatsapp: '32 99925-6417',
    closing: 'Esperamos você!'
  };

  // ---- Gift-suggestion page (shown automatically after the invite opens) ----
  const GIFT_CONFIG = {
    eyebrow: 'Sugestão de Presente',
    name: 'Luiza',
    categories: 'Roupinhas | Calçados',
    closing: 'Também adoro brinquedos!'
  };

  function fillText(id, text) {
    document.getElementById(id).textContent = text;
  }

  fillText('inv-name', CONFIG.name);
  fillText('inv-age', CONFIG.age);
  fillText('inv-eyebrow', CONFIG.eyebrow);
  fillText('inv-message', CONFIG.message);
  fillText('inv-day', CONFIG.day);
  fillText('inv-month', CONFIG.month);
  fillText('inv-time', CONFIG.time);
  fillText('inv-weekday', CONFIG.weekday);
  fillText('inv-venue', CONFIG.venueName + ' - ' + CONFIG.venueAddress + '\n' + CONFIG.city);
  fillText('inv-whatsapp', 'Por gentileza, confirme a sua presença no WhatsApp: ' + CONFIG.whatsapp);
  fillText('inv-closing', CONFIG.closing);

  fillText('gift-eyebrow', GIFT_CONFIG.eyebrow);
  fillText('gift-name', GIFT_CONFIG.name);
  fillText('gift-categories', GIFT_CONFIG.categories);
  fillText('gift-closing', GIFT_CONFIG.closing);

  // Preserve the line break inside the venue block
  document.getElementById('inv-venue').innerHTML =
    CONFIG.venueName + ' - ' + CONFIG.venueAddress + '<br>' + CONFIG.city;

  // ---- Interaction ----
  const scrollStage = document.getElementById('scroll-stage');
  const scrollClosed = document.getElementById('scroll-closed');
  const scrollOpen = document.getElementById('scroll-open');
  const videoAbertura = document.getElementById('video-abertura');
  const ctaText = document.getElementById('cta-text');
  const skipBtn = document.getElementById('skip-btn');
  const inviteContent = document.getElementById('invite-content');
  const giftContent = document.getElementById('gift-content');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function waitForTransitionEnd(el, propertyName) {
    return new Promise((resolve) => {
      el.addEventListener('transitionend', function onEnd(e) {
        if (propertyName && e.propertyName !== propertyName) return;
        el.removeEventListener('transitionend', onEnd);
        resolve();
      });
    });
  }

  // How long to hold on the fully-open invite, once its own opening
  // animation has completely finished, before the gift-suggestion page
  // starts entering.
  const GIFT_PAGE_DELAY = 10000;

  let giftShown = false;

  // Runs once the invite has fully finished opening (video crossfade done,
  // or the instant fallback). Never starts the 2s countdown before that —
  // it only ever begins counting once this function is actually called.
  async function showGiftPage() {
    if (giftShown) return;
    giftShown = true;

    // This pause is reading time, not a motion effect, so it applies even
    // under prefers-reduced-motion — only the crossfade below is skipped
    // in that case, never the wait itself.
    await delay(GIFT_PAGE_DELAY);

    if (prefersReducedMotion) {
      inviteContent.classList.remove('shown');
      giftContent.classList.add('shown', 'instant');
      return;
    }

    // Fade the invite text out, then — using the exact same entrance
    // transition already defined on .invite-content/.shown — fade the
    // gift text in on the same parchment, in the same spot.
    const fadeOutDone = waitForTransitionEnd(inviteContent, 'opacity');
    inviteContent.classList.remove('shown');
    await fadeOutDone;

    giftContent.classList.add('shown');
  }

  // Three states: (1) closed scroll awaiting a click, (2) opening video
  // playing, (3) scroll fully open with the invite text. `opened` blocks
  // re-entering state 2; `finalPrepared` guards state 3 from being entered
  // twice (it can be triggered by timeupdate, ended, an error, or the
  // fallback timer, and only the first should count).
  let opened = false;
  let finalPrepared = false;
  let fallbackTimer = null;
  let videoStarted = false;
  let videoStartTimer = null;

  // How long before the video's natural end to start crossfading it out.
  // Matches #video-abertura's own opacity transition duration so the CSS
  // fade finishes right around when the video actually ends.
  const CROSSFADE_SECONDS = 0.4;

  // Reveal the already-open scroll + invite text instantly (no transition)
  // underneath the still-opaque video, then fade the video away. Because
  // both elements share the same box as the video, nothing shifts.
  function prepareFinalState() {
    if (finalPrepared) return;
    finalPrepared = true;

    if (fallbackTimer) {
      clearTimeout(fallbackTimer);
      fallbackTimer = null;
    }

    scrollOpen.classList.add('revealed', 'instant');
    inviteContent.classList.add('shown', 'instant');

    videoAbertura.classList.remove('active');

    videoAbertura.addEventListener('transitionend', function onFadeOutDone(e) {
      if (e.propertyName !== 'opacity') return;
      videoAbertura.removeEventListener('transitionend', onFadeOutDone);
      videoAbertura.pause();
      videoAbertura.hidden = true;

      // The invite's own opening animation (the video handoff) has now
      // truly finished — this is the real trigger for the gift page's
      // countdown, not the click. Undo the transition-free 'instant'
      // snap so the invite text can fade out normally afterwards.
      inviteContent.classList.remove('instant');
      showGiftPage();
    });
  }

  // Fallback path: used for prefers-reduced-motion and whenever the video
  // can't play at all, so the invite is never stuck behind a broken video.
  function openScrollInstant() {
    opened = true;
    finalPrepared = true;
    videoStarted = true; // ignore a late 'playing' event if it still arrives

    if (fallbackTimer) {
      clearTimeout(fallbackTimer);
      fallbackTimer = null;
    }
    if (videoStartTimer) {
      clearTimeout(videoStartTimer);
      videoStartTimer = null;
    }

    scrollClosed.classList.add('swing-stopped', 'faded');
    scrollOpen.classList.add('revealed', 'instant');
    ctaText.classList.add('hidden');
    skipBtn.classList.add('hidden');
    inviteContent.classList.add('shown', 'instant');

    videoAbertura.classList.remove('active');
    videoAbertura.pause();
    videoAbertura.hidden = true;

    inviteContent.classList.remove('instant');
    showGiftPage();
  }

  function openScroll() {
    if (opened) return;
    opened = true;

    ctaText.classList.add('hidden');
    skipBtn.classList.add('hidden');

    // Start the background music from this exact click too — the same
    // proven-reliable gesture that plays the video's own audio. Mobile
    // browsers (Safari in particular) only grant audible autoplay to a
    // narrow set of trusted events, and 'touchstart' — used below as an
    // earlier, best-effort trigger — isn't reliably one of them, so this
    // click is the real guarantee, not just a backup.
    startMusic();

    // Ask the video to play right away, from the same synchronous click
    // handler, so the user gesture carries through to audio playback.
    // The closed scroll stays put until we actually get a frame back
    // (see the 'playing' listener below) — swapping it out immediately
    // used to leave a blank gap whenever the file hadn't buffered enough
    // yet, which is what showed up as "the video doesn't load".
    const playPromise = videoAbertura.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(function (err) {
        console.warn('[abertura] video play() failed, falling back to instant open', err);
        openScrollInstant();
      });
    }

    // If no frame has actually rendered within a few seconds — slow
    // connection, stalled buffering, etc. — stop waiting and show the
    // finished invite instead of leaving the user looking at nothing.
    videoStartTimer = setTimeout(function () {
      if (!videoStarted && !finalPrepared) {
        console.warn('[abertura] video did not start in time, falling back to instant open');
        openScrollInstant();
      }
    }, 4000);
  }

  videoAbertura.addEventListener('playing', function () {
    if (videoStarted || finalPrepared) return;
    videoStarted = true;

    if (videoStartTimer) {
      clearTimeout(videoStartTimer);
      videoStartTimer = null;
    }

    // Only now, with an actual frame on screen, do we crossfade the
    // closed scroll into the video.
    scrollClosed.classList.add('swing-stopped', 'faded');
    videoAbertura.hidden = false;
    videoAbertura.classList.add('active');

    // Safety net: guarantees the invite opens even if playback stalls
    // partway through and neither 'timeupdate' nor 'ended' ever fire.
    fallbackTimer = setTimeout(prepareFinalState, 8000);
  });

  videoAbertura.addEventListener('timeupdate', function () {
    if (finalPrepared) return;
    const duration = videoAbertura.duration;
    if (!isFinite(duration) || duration <= 0) return;
    if (videoAbertura.currentTime >= duration - CROSSFADE_SECONDS) {
      prepareFinalState();
    }
  });

  videoAbertura.addEventListener('ended', prepareFinalState);

  videoAbertura.addEventListener('error', function () {
    if (!opened || finalPrepared) return;
    console.warn('[abertura] video error, falling back to instant open');
    if (videoStartTimer) {
      clearTimeout(videoStartTimer);
      videoStartTimer = null;
    }
    openScrollInstant();
  });

  scrollStage.addEventListener('click', openScroll);
  scrollStage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openScroll();
    }
  });
  skipBtn.addEventListener('click', openScroll);

  if (prefersReducedMotion) {
    openScrollInstant();
  }

  // ---- Background music ----
  //
  // Self-hosted file, same origin as the page itself — no external API,
  // no cross-origin iframe, no postMessage round-trip. play() is called
  // directly from a real user gesture (the visitor's first click/key/tap
  // anywhere on the page), which every major browser allows for audible
  // playback, so there's no need for the old "start muted, unmute later"
  // workaround that a cross-origin YouTube iframe required.
  const musicToggle = document.getElementById('music-toggle');
  const bgMusic = document.getElementById('bg-music');
  bgMusic.volume = 0.7;

  let musicStarted = false;

  function startMusic() {
    if (musicStarted) return;
    musicStarted = true;
    const playPromise = bgMusic.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(function (err) {
        console.warn('[music] play() failed, will retry on the next interaction', err);
        musicStarted = false;
      });
    }
  }

  bgMusic.addEventListener('error', function () {
    console.warn('[music] failed to load the audio file');
  });

  // 'touchend' (a completed tap), not 'touchstart' (which can still turn
  // into a scroll/swipe) — Safari in particular doesn't reliably treat a
  // bare touchstart as a gesture that's allowed to start audible media.
  document.addEventListener('click', startMusic, { once: true, capture: true });
  document.addEventListener('keydown', startMusic, { once: true, capture: true });
  document.addEventListener('touchend', startMusic, { once: true, capture: true });

  musicToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!musicStarted) {
      startMusic();
      return;
    }
    bgMusic.muted = !bgMusic.muted;
    musicToggle.classList.toggle('muted', bgMusic.muted);
  });
</script>
